<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Shivanie and Theo">
  <!-- Four-loop pulli kolam knot in zari gold-foil on arakku silk maroon.
       Pure outlined paths (no webfont), legible down to 16px. -->
