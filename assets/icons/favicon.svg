    <linearGradient id="ff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6C765"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#786012"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#7E1431"/>
  <rect x="6.5" y="6.5" width="51" height="51" rx="10" fill="none" stroke="url(#ff)" stroke-width="1.6" opacity="0.55"/>
  <g fill="none" stroke="url(#ff)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 32 C 24 24, 24 12, 32 8  C 40 12, 40 24, 32 32 Z"/>
    <path d="M32 32 C 40 24, 52 24, 56 32 C 52 40, 40 40, 32 32 Z"/>
    <path d="M32 32 C 40 40, 40 52, 32 56 C 24 52, 24 40, 32 32 Z"/>
    <path d="M32 32 C 24 40, 12 40, 8 32  C 12 24, 24 24, 32 32 Z"/>
  </g>
  <circle cx="32" cy="32" r="3.6" fill="url(#ff)"/>
</svg>
