<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Authentic pulli (dot-grid) kolam corner. Maroon dots, gold-foil continuous line.
       Composition is symmetric about the top-left/bottom-right diagonal, so CSS rotate()
       reads identically when this is mirrored to all four corners of .ornate-frame. -->
  <defs>
    <linearGradient id="kf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6C765"/>
      <stop offset="0.45" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#786012"/>
    </linearGradient>
  </defs>
  <g stroke="url(#kf)">
    <!-- corner sweeps hugging the pivot -->
    <path d="M6 62 C 6 30, 30 6, 62 6" stroke-width="1.7"/>
    <path d="M13 60 C 13 33, 33 13, 60 13" stroke-width="1.1" opacity="0.55"/>
    <!-- rosette petals woven around the corner pulli (18,18) -->
    <path d="M18 6 C 23.5 11, 23.5 19, 18 24 C 12.5 19, 12.5 11, 18 6 Z" stroke-width="1.4"/>
    <path d="M6 18 C 11 23.5, 19 23.5, 24 18 C 19 12.5, 11 12.5, 6 18 Z" stroke-width="1.4"/>
    <!-- diagonal lotus bud reaching into the corner -->
    <path d="M28 28 C 20 22, 14 18, 9 9 C 18 14, 22 20, 28 28 Z" stroke-width="1.2" opacity="0.85"/>
    <!-- lotus tips terminating the sweep -->
    <path d="M55 8 C 59 2, 65 2, 69 8" stroke-width="1.2"/>
    <path d="M8 55 C 2 59, 2 65, 8 69" stroke-width="1.2"/>
    <!-- small loops cradling the outer pulli -->
    <path d="M40 12 C 44 8, 50 8, 52 13" stroke-width="1" opacity="0.75"/>
    <path d="M12 40 C 8 44, 8 50, 13 52" stroke-width="1" opacity="0.75"/>
  </g>
  <!-- pulli (kolam dots) -->
  <g fill="#7E1431">
    <circle cx="18" cy="18" r="2.4"/>
    <circle cx="34" cy="18" r="1.5"/>
    <circle cx="18" cy="34" r="1.5"/>
    <circle cx="30" cy="30" r="1.4"/>
    <circle cx="50" cy="13" r="1.2"/>
    <circle cx="13" cy="50" r="1.2"/>
  </g>
</svg>
