<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Stepped gopuram (temple gateway) silhouette in gold-foil outline, crowning the hero:
       two pillars, an ogee thoranam arch, stepped tiers and a kalasam finial. Symmetric. -->
  <defs>
    <linearGradient id="gf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6C765"/>
      <stop offset="1" stop-color="#786012"/>
    </linearGradient>
  </defs>
  <g stroke="url(#gf)" stroke-width="2">
    <!-- pillars -->
    <path d="M150 256 L150 168"/>
    <path d="M330 256 L330 168"/>
    <!-- capitals -->
    <path d="M138 168 H162"/>
    <path d="M318 168 H342"/>
    <path d="M134 160 H166"/>
    <path d="M314 160 H346"/>
    <!-- ogee arch (thoranam) -->
    <path d="M150 160 C 150 112, 196 86, 240 86 C 284 86, 330 112, 330 160"/>
    <path d="M166 160 C 166 120, 204 98, 240 98 C 276 98, 314 120, 314 160" stroke-width="1.3" opacity="0.6"/>
    <!-- pendant at the arch crown -->
    <path d="M240 98 q -6 10, 0 20 q 6 -10, 0 -20 Z" stroke-width="1.3"/>
    <!-- stepped tiers -->
    <path d="M158 86 L176 64 L192 46 L206 30"/>
    <path d="M322 86 L304 64 L288 46 L274 30"/>
    <path d="M158 86 H322" stroke-width="1.3" opacity="0.5"/>
    <path d="M176 64 H304"/>
    <path d="M192 46 H288"/>
    <path d="M206 30 H274"/>
    <!-- kalasam finial -->
    <path d="M226 30 Q240 14, 254 30"/>
    <path d="M240 30 L240 8"/>
  </g>
  <circle cx="240" cy="6"  r="3.4" fill="url(#gf)"/>
  <circle cx="206" cy="30" r="2.2" fill="url(#gf)"/>
  <circle cx="274" cy="30" r="2.2" fill="url(#gf)"/>
</svg>
