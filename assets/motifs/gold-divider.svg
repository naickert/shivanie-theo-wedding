<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 40" fill="none" stroke="#9E821C" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Horizontal flanking lines -->
  <line x1="0"   y1="20" x2="120" y2="20" stroke-width="0.75" opacity="0.7"/>
  <line x1="200" y1="20" x2="320" y2="20" stroke-width="0.75" opacity="0.7"/>
  <line x1="20"  y1="20" x2="110" y2="20" stroke-width="0.35" opacity="0.5"/>
  <line x1="210" y1="20" x2="300" y2="20" stroke-width="0.35" opacity="0.5"/>
  <!-- Small flanking circles -->
  <circle cx="120" cy="20" r="2.5" fill="#D4AF37" stroke="none"/>
  <circle cx="200" cy="20" r="2.5" fill="#D4AF37" stroke="none"/>
  <!-- Central paisley (mango/aam) motif -->
  <g transform="translate(160,20)">
    <!-- Paisley body -->
    <path d="M 0 -14 C 12 -12, 14 0, 8 10 C 4 16, -4 16, -8 10 C -14 0, -12 -12, 0 -14 Z" stroke="#9E821C"/>
    <!-- Inner curl -->
    <path d="M -2 -8 C 4 -6, 6 0, 2 6" stroke-width="0.9"/>
    <!-- Centre dot -->
    <circle cx="0" cy="-2" r="1.6" fill="#D4AF37" stroke="none"/>
    <!-- Top flourish -->
    <path d="M -4 -14 Q 0 -20, 4 -14" stroke-width="0.9"/>
    <!-- Side leaves -->
    <path d="M -16 6 Q -22 0, -16 -6" stroke-width="0.9" opacity="0.8"/>
    <path d="M 16 6 Q 22 0, 16 -6" stroke-width="0.9" opacity="0.8"/>
  </g>
</svg>
