<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 40" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Zari rule: gold-foil hairlines flanking a central lotus, with mango (aam) paisley buds. -->
  <defs>
    <linearGradient id="df" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#786012"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#786012"/>
    </linearGradient>
    <linearGradient id="dfv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6C765"/>
      <stop offset="1" stop-color="#786012"/>
    </linearGradient>
  </defs>
  <!-- flanking gold rules (no sub-pixel strokes) -->
  <g stroke="url(#df)">
    <line x1="8"   y1="20" x2="118" y2="20" stroke-width="1.2"/>
    <line x1="202" y1="20" x2="312" y2="20" stroke-width="1.2"/>
    <line x1="34"  y1="20" x2="112" y2="20" stroke-width="0.9" opacity="0.55"/>
    <line x1="208" y1="20" x2="286" y2="20" stroke-width="0.9" opacity="0.55"/>
  </g>
  <!-- flanking mango paisley buds + beads -->
  <g stroke="url(#df)" stroke-width="1">
    <path d="M118 20 C 108 12, 96 12, 92 20 C 96 28, 108 28, 118 20 Z" opacity="0.85"/>
    <path d="M202 20 C 212 12, 224 12, 228 20 C 224 28, 212 28, 202 20 Z" opacity="0.85"/>
  </g>
  <g fill="url(#dfv)">
    <circle cx="118" cy="20" r="3"/>
    <circle cx="202" cy="20" r="3"/>
    <circle cx="92"  cy="20" r="1.5"/>
    <circle cx="228" cy="20" r="1.5"/>
  </g>
  <!-- central lotus -->
  <g transform="translate(160 20)">
    <path d="M0 -13 C 6 -6, 6 6, 0 14 C -6 6, -6 -6, 0 -13 Z" stroke="url(#dfv)" stroke-width="1.2"/>
    <path d="M0 14 C -10 9, -17 2, -16 -7 C -8 -3, -3 5, 0 14 Z" stroke="url(#dfv)" stroke-width="1.1" opacity="0.9"/>
    <path d="M0 14 C 10 9, 17 2, 16 -7 C 8 -3, 3 5, 0 14 Z" stroke="url(#dfv)" stroke-width="1.1" opacity="0.9"/>
    <path d="M-6 -14 Q 0 -22, 6 -14" stroke="url(#df)" stroke-width="0.9"/>
    <circle cx="0" cy="-1" r="2" fill="url(#dfv)"/>
  </g>
</svg>
