<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 240" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Peacock feather: barbs emanate from the rachis (not a starburst), with the
       layered eye (peacock -> mango-leaf -> arakku -> zari -> ink). Gold-foil throughout. -->
  <defs>
    <linearGradient id="pf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6C765"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#786012"/>
    </linearGradient>
  </defs>
  <!-- rachis / stem -->
  <path d="M50 236 C 49 188, 51 130, 50 86" stroke="url(#pf)" stroke-width="1.2"/>
  <!-- herl: paired barbs leaving the rachis, curving up and out -->
  <g stroke="url(#pf)" stroke-width="0.7" opacity="0.55">
    <path d="M50 96  C 40 92,  32 86,  27 74"/>
    <path d="M50 96  C 60 92,  68 86,  73 74"/>
    <path d="M50 112 C 38 110, 28 104, 22 92"/>
    <path d="M50 112 C 62 110, 72 104, 78 92"/>
    <path d="M50 130 C 37 130, 26 126, 19 114"/>
    <path d="M50 130 C 63 130, 74 126, 81 114"/>
    <path d="M50 150 C 38 152, 28 150, 21 140"/>
    <path d="M50 150 C 62 152, 72 150, 79 140"/>
    <path d="M50 172 C 39 175, 30 175, 24 167"/>
    <path d="M50 172 C 61 175, 70 175, 76 167"/>
    <path d="M50 196 C 41 200, 34 201, 29 195"/>
    <path d="M50 196 C 59 200, 66 201, 71 195"/>
  </g>
  <!-- plume barbs fanning around the eye -->
  <g stroke="url(#pf)" stroke-width="0.6" opacity="0.5">
    <path d="M50 84 C 44 70, 40 52, 42 34"/>
    <path d="M50 84 C 56 70, 60 52, 58 34"/>
    <path d="M50 84 C 38 72, 30 56, 30 40"/>
    <path d="M50 84 C 62 72, 70 56, 70 40"/>
    <path d="M50 84 C 33 74, 22 60, 20 46"/>
    <path d="M50 84 C 67 74, 78 60, 80 46"/>
  </g>
  <!-- layered eye -->
  <ellipse cx="50" cy="52" rx="20"  ry="28" stroke="url(#pf)" stroke-width="1"/>
  <ellipse cx="50" cy="52" rx="14"  ry="20" fill="#1B4965"/>
  <ellipse cx="50" cy="52" rx="10"  ry="15" fill="#2D5016"/>
  <ellipse cx="50" cy="50" rx="6.5" ry="10" fill="#7E1431"/>
  <ellipse cx="50" cy="48" rx="3.4" ry="6"  fill="url(#pf)"/>
  <circle  cx="50" cy="46" r="1.6" fill="#1A1A1A"/>
</svg>
